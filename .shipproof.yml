# ShipProof Configuration
# Suppress false positives and document intentional patterns

version: 1

suppressions:
  # SP003 - Test fixtures and benchmark passwords (not real credentials)
  - rule: SP003
    paths:
      - "crates/wallet/benches/**"
      - "crates/wallet/src/backup.rs"
      - "crates/wallet/INTEGRATION.md"
      - "**/tests/**"
      - "**/benches/**"
    reason: "Test fixtures and benchmark code use hardcoded passwords for reproducibility. Not production credentials."

  # SP109 - Legitimate AWS metadata access in CI
  - rule: SP109
    paths:
      - ".github/workflows/**"
    pattern: "169.254.169.254"
    reason: "Legitimate AWS EC2 metadata access for CI authentication. Running in trusted GitHub Actions environment."

  # SP109 - Localhost health checks in deployment scripts
  - rule: SP109
    paths:
      - ".github/workflows/deploy-*.yml"
      - "scripts/**"
    pattern: "localhost|127.0.0.1"
    reason: "Localhost health checks for node startup validation. No external user input involved."

  # SP109 - Local RPC calls in tests
  - rule: SP109
    paths:
      - "**/tests/**"
      - "crates/node/src/**"
    pattern: "127.0.0.1:8332|localhost:8332"
    reason: "Local node RPC calls for integration testing. Hardcoded localhost endpoints in test environment."

# Fail build on these severities
fail_on:
  - critical
  # Note: HIGH findings (SP203 unpinned actions) acknowledged but not blocking
  # Plan: Pin actions incrementally before public launch

# Scan configuration
scan:
  exclude_paths:
    - "target/**"
    - ".git/**"
    - "**/.claude/**"
    - "**/node_modules/**"
