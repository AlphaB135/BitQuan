apiVersion: v1
kind: ConfigMap
metadata:
  name: bitquan-config
  namespace: bitquan-mainnet
data:
  config.toml: |
    [network]
    network_id = "mainnet"
    listen_addresses = ["0.0.0.0:8333"]
    max_peers = 200
    min_peers = 20

    [rpc]
    enabled = true
    bind_address = "0.0.0.0:8080"
    cors_origins = ["https://mainnet.bitquan.network"]

    [mining]
    enabled = true
    stratum_port = 3333
    max_connections = 10000

    [storage]
    backend = "rocksdb"
    data_dir = "/data/bitquan"

    [logging]
    level = "warn"
    file_path = "/data/logs/bitquan.log"

    [monitoring]
    enabled = true
    metrics_port = 8081
    health_check_interval = 30
