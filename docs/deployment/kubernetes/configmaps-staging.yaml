apiVersion: v1
kind: ConfigMap
metadata:
  name: bitquan-config
  namespace: bitquan-staging
data:
  config.toml: |
    [network]
    network_id = "testnet"
    listen_addresses = ["0.0.0.0:8333"]
    max_peers = 50
    min_peers = 8

    [rpc]
    enabled = true
    bind_address = "0.0.0.0:8080"
    cors_origins = ["*"]

    [mining]
    enabled = true
    stratum_port = 3333
    max_connections = 1000

    [storage]
    backend = "rocksdb"
    data_dir = "/data/bitquan"

    [logging]
    level = "debug"
    file_path = "/data/logs/bitquan.log"

    [monitoring]
    enabled = true
    metrics_port = 8081
    health_check_interval = 30
