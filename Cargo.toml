[workspace]
# Workspace configuration for BitQuan blockchain
resolver = "2"
members = [
    "crates/node",
    "crates/types",
    "crates/crypto",
    "crates/consensus",
    "crates/mempool",
    "crates/network",
    "crates/pqc-dilithium-seeded",
    "crates/storage",
    "crates/rpc", "crates/wallet",
    "crates/bq-sdk",
    "crates/faucet",
    "crates/tools/preflight",
    "crates/tools/stress",

]
exclude = ["fuzz", "forks", "tools/bitquan-gui"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bitquan/bitquan"
rust-version = "1.79"
description = "BitQuan blockchain node and supporting crates with post-quantum cryptography focus."

[workspace.lints.rust]
unsafe_code = "forbid"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unused_results = "warn"

[workspace.lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
bytes = "1.11.1"  # RUSTSEC-2026-0007: warp 0.4.2 uses 1.11.0 (vulnerable)
hex = "0.4"
rocksdb = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
zeroize = "1.8"
http = "0.2"
rand = "0.8"
rand_chacha = "0.3"
criterion = "0.5"
secrecy = "0.8"
tokio = { version = "1", features = ["full"] }
prometheus = "0.13"
async-trait = "0.1"
lazy_static = "1.4"
rayon = "1.10"
log = "0.4"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.bq-crypto]
opt-level = 1
[profile.dev.package.bq-pqc-dilithium-seeded]
opt-level = 1
