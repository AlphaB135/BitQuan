[workspace]
members = [
    "crates/node",
    "crates/types",
    "crates/crypto",
    "crates/consensus",
    "crates/mempool",
    "crates/network",
    "crates/storage",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bitquan/bitquan"
rust-version = "1.79"
description = "BitQuan blockchain node and supporting crates with post-quantum cryptography focus."

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
