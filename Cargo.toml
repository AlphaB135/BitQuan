[workspace]
resolver = "2"
members = [
    "crates/node",
    "crates/types",
    "crates/crypto",
    "crates/consensus",
    "crates/mempool",
    "crates/network",
    "crates/pqc-dilithium-seeded",
    "crates/storage",
    "crates/rpc", "crates/wallet",
]
exclude = ["fuzz", "forks"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bitquan/bitquan"
rust-version = "1.79"
description = "BitQuan blockchain node and supporting crates with post-quantum cryptography focus."

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rocksdb = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "1.0"
zeroize = "1.8"
http = "0.2"
