[workspace]
resolver = "2"
members = [
    "crates/node",
    "crates/types",
    "crates/crypto",
    "crates/consensus",
    "crates/mempool",
    "crates/network",
    "crates/pqc-dilithium-seeded",
    "crates/storage",
    "crates/rpc", "crates/wallet",
    "crates/bq-sdk",
    "crates/tools/preflight",
    "crates/tools/stress",

]
exclude = ["fuzz", "forks", "tools/bitquan-gui"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bitquan/bitquan"
rust-version = "1.79"
description = "BitQuan blockchain node and supporting crates with post-quantum cryptography focus."

[workspace.lints.rust]
unsafe_code = "forbid"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unused_results = "warn"

[workspace.lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rocksdb = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
zeroize = "1.8"
http = "0.2"
rand = "0.8"
rand_chacha = "0.3"
criterion = "0.5"
secrecy = "0.8"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
