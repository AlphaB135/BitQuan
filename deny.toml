[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db.git"]
ignore = []

[licenses]
version = 2
# Explicitly allow common permissive licenses
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",   # Add BSD-2-Clause for arrayref
    "ISC",
    "CC0-1.0",        # Public domain equivalent (used by bitcoin crates)
    "Unicode-3.0",   # Unicode license (used by unicode-ident)
    "OpenSSL",       # Required by aws-lc-sys (rustls backend)
    "Zlib",          # OSI approved, FSF Free/Libre (used by foldhash)
    # "CDLA-Permissive-2.0",  # Community Data License Agreement (not currently used)
]

# แก้ไขปัญหา license ที่ยังคงอยู่
[[licenses.exceptions]]
allow = ["Zlib"]
name = "foldhash"
version = "0.1.5"

[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"
version = "1.0.3"

# หรือใช้วิธีนี้ถ้ายังไม่ได้ผล
# allow = [
#     "Apache-2.0",
#     "MIT",
#     "BSD-3-Clause",
#     "ISC",
#     "CC0-1.0",
#     "Unicode-3.0",
#     "OpenSSL",
#     "Zlib",
#     "CDLA-Permissive-2.0",
#     "Zlib OR Apache-2.0 OR MIT",  # รูปแบบที่ foldhash อาจใช้
# ]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
