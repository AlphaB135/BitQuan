[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db.git"]
ignore = [
    # bincode 1.3.3 is unmaintained but we pin it for data format stability
    # Will upgrade to bincode 2.0 with proper migration plan
    "RUSTSEC-2025-0141",
    # protobuf 2.28.0 vulnerability from prometheus 0.13.4
    # Will upgrade prometheus after stabilizing metrics
    "RUSTSEC-2024-0437",
    # rsa crate timing side-channel (transitive via jsonwebtoken 10.x)
    # Only used in local JWT signing, not exposed to network timing attacks
    "RUSTSEC-2023-0071",
    # time crate RFC 2822 parsing stack exhaustion (RUSTSEC-2026-0009)
    # Transitive via rcgen. We don't parse user-provided RFC 2822 input.
    # Cannot downgrade: rcgen 0.14 requires time ^0.3.35
    "RUSTSEC-2026-0009",
    # paste crate unmaintained (transitive via ratatui)
    # No safe upgrade available. ratatui team will migrate in next major release.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Explicitly allow common permissive licenses
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",   # Add BSD-2-Clause for arrayref
    "ISC",
    "CC0-1.0",        # Public domain equivalent (used by bitcoin crates)
    "Unicode-3.0",   # Unicode license (used by unicode-ident)
    "OpenSSL",       # Required by aws-lc-sys (rustls backend)
    "Zlib",          # OSI approved, FSF Free/Libre (used by foldhash)
]

# แก้ไขปัญหา license ที่ยังคงอยู่
[[licenses.exceptions]]
allow = ["Zlib"]
name = "foldhash"
version = "0.1.5"

[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"
version = "1.0.3"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
