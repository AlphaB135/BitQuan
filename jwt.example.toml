# JWT Authentication Configuration
# IMPORTANT: Set JWT_SECRET environment variable with a secure, randomly generated secret
# Generate a new secret with: openssl rand -hex 32
secret = "${JWT_SECRET}"

[[users]]
username = "admin"
password_hash = "${JWT_ADMIN_PASSWORD_HASH}"
role = "admin"

