version: "3.8"

# BitQuan Testnet Stack
# Usage: docker-compose up -d
# Then visit http://localhost:3000 for Grafana dashboards

services:
  bitquan-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitquan-testnet
    restart: unless-stopped
    command: >
      --network testnet
      --datadir /data/testnet
      --rpc
      --rpc-bind 0.0.0.0:19443
      --mine
      --threads 2
    ports:
      - "19444:19444"  # P2P
      - "19443:19443"  # RPC
    volumes:
      - bitquan-data:/data/testnet
      - ./config/testnet.toml:/etc/bitquan/testnet.toml:ro
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bitquan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: bitquan-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/bitquan.json:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  bitquan-data:
  prometheus-data:
  grafana-data:
