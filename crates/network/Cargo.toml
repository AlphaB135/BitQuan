[package]
name = "bitquan-network"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Peer-to-peer networking scaffolding for BitQuan."

[dependencies]
bitquan-types = { path = "../types", version = "0.1.0" }
bitquan-consensus = { path = "../consensus", version = "0.1.0" }
bitquan-storage = { path = "../storage", version = "0.1.0" }
thiserror.workspace = true
serde.workspace = true
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
log = "0.4"
toml = "0.9"
hex = "0.4"
libc = "0.2"

# P2P Encryption: Noise Protocol Framework
snow = "0.9"
zeroize.workspace = true

# Async runtime for network layer
tokio = { workspace = true }
futures = "0.3"
async-trait = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sync_vs_async"
harness = false
