[package]
name = "faucet"
version = "0.1.0"
edition = "2021"

[dependencies]
warp = { version = "0.4", features = ["server"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
lazy_static = "1.5"

[dependencies.bitquan-rpc]
version = "0.1.0"
path = "../rpc"
