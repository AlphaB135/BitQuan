[package]
name = "wallet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"
secrecy = "0.8"
rpassword = { version = "7.3", optional = true }
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
hex.workspace = true
lazy_static = "1.4"
log.workspace = true
bitquan-types = { path = "../types", version = "0.1.0" }
bq-crypto = { path = "../crypto", version = "0.1.0" }
pqc-dilithium-seeded = { path = "../pqc-dilithium-seeded", version = "0.2.1" }

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wallet_performance"
harness = false

[features]
cli = ["rpassword"]

[[example]]
name = "cli_demo"
required-features = ["cli"]

[[example]]
name = "wallet_usage"
path = "../../examples/wallet_usage.rs"

[[test]]
name = "pqc_integration_test"
path = "../../tests/pqc_integration_test.rs"
