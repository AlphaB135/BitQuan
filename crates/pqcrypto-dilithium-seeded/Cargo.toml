[package]
name = "pqcrypto-dilithium-seeded"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Wrapper around pqcrypto-dilithium with deterministic key generation support"

[dependencies]
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"

[features]
default = []
avx2 = ["pqcrypto-dilithium/avx2"]
neon = ["pqcrypto-dilithium/neon"]
