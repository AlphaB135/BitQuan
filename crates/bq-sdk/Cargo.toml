[package]
name = "bq-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alphab/BitQuan"
description = "BitQuan SDK with post-quantum wallet support"

[features]
default = ["std", "pq-psbt"]
std = []
pq-psbt = ["pqc-dilithium-seeded"]
hardware = ["hidapi"]
wasm = ["getrandom/js"]

[dependencies]
# BitQuan dependencies
bitquan-types = { path = "../types", version = "0.1.0" }
bq-crypto = { path = "../crypto", version = "0.1.0" }
pqc-dilithium-seeded = { path = "../pqc-dilithium-seeded", version = "0.2.1", optional = true }

# Cryptography
sha2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
argon2 = "0.5"
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"
bech32 = "0.11"
libc = "0.2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"
byteorder = "1.5"
serde_bytes = "0.11"
serde-big-array = "0.5"

# Utilities
thiserror = "1.0"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# Hardware wallet support
hidapi = { version = "2.6", optional = true }

# Async support
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"
criterion = "0.5"

# [[bench]]
# name = "wallet_performance"
# harness = false

# [[bench]]
# name = "psbt_performance"
# harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
