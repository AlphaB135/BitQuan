[package]
name = "bitquan-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "BitQuan reference node entrypoint."

[dependencies]
argon2 = "0.5"
base64 = "0.22"
base64ct = { version = "1.6.0", features = ["alloc"] }
bech32 = "0.11.0"
bip39 = "2.2.0"
bitquan-consensus = { path = "../consensus", version = "0.1.0" }
bitquan-mempool = { path = "../mempool", version = "0.1.0" }
bitquan-network = { path = "../network", version = "0.1.0" }
bitquan-rpc = { path = "../rpc", version = "0.1.0" }
bitquan-storage = { path = "../storage", version = "0.1.0" }
bitquan-types = { path = "../types", version = "0.1.0" }
bq-crypto = { path = "../crypto", version = "0.0.1" }
wallet = { path = "../wallet", version = "0.1.0" }
rpassword = "7.3"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap.workspace = true
getrandom = "0.2"
hex.workspace = true
hmac = "0.12"
num_cpus = "1.16"
pqc-dilithium-seeded = { path = "../pqc-dilithium-seeded", version = "0.2.1" }
rand = "0.8"
rand_chacha = "0.3"
serde.workspace = true
serde_json = "1.0"
sha2.workspace = true
zeroize.workspace = true
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "5.5"
lru = "0.12"

[features]
default = ["rocksdb-backend"]
rocksdb-backend = ["bitquan-storage/rocksdb-backend"]
randomx = ["bitquan-consensus/randomx"]
