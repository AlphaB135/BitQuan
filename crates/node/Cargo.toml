[package]
name = "bitquan-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "BitQuan reference node entrypoint."

[dependencies]
anyhow.workspace = true
bitquan-consensus = { path = "../consensus", version = "0.1.0" }
bitquan-mempool = { path = "../mempool", version = "0.1.0" }
bitquan-network = { path = "../network", version = "0.1.0" }
bitquan-rpc = { path = "../rpc", version = "0.1.0" }
bitquan-storage = { path = "../storage", version = "0.1.0" }
bitquan-types = { path = "../types", version = "0.1.0" }
bq-crypto = { path = "../crypto", version = "0.0.1" }
clap.workspace = true
hex.workspace = true
num_cpus = "1.16"
pqc_dilithium = "0.2"
serde.workspace = true
serde_json = "1.0"
sha2.workspace = true
zeroize.workspace = true

[features]
default = ["rocksdb-backend"]
rocksdb-backend = ["bitquan-storage/rocksdb-backend"]
