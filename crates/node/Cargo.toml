[package]
name = "bitquan-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "BitQuan reference node entrypoint."

[lib]
name = "bitquan_node"
path = "src/lib.rs"

[[bin]]
name = "bitquan-node"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
base64ct = { version = "1.8.3", features = ["alloc"] }
bech32 = "0.11.0"
bip39 = "2.2.0"
bitquan-consensus = { path = "../consensus", version = "0.1.0" }
bitquan-mempool = { path = "../mempool", version = "0.1.0" }
bitquan-network = { path = "../network", version = "0.1.0" }
bitquan-rpc = { path = "../rpc", version = "0.1.0" }
bitquan-storage = { path = "../storage", version = "0.1.0" }
bitquan-types = { path = "../types", version = "0.1.0" }
bq-crypto = { path = "../crypto", version = "0.1.0" }
wallet = { path = "../wallet", version = "0.1.0" }
rpassword = "7.5"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap.workspace = true
getrandom = "0.2"
hex.workspace = true
hmac = "0.12"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["fs", "user"] }
num_cpus = "1.16"
pqc-dilithium-seeded = { path = "../pqc-dilithium-seeded", version = "0.2.1" }
rand = "0.8"
rand_chacha = "0.3"
secrecy.workspace = true
serde.workspace = true
serde_json = "1.0"
sha2.workspace = true
zeroize.workspace = true
tokio = { version = "1.50", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
dashmap = "6.1"
lru = "0.16"
rusqlite = { version = "0.30", features = ["bundled"] }
warp = { version = "0.4", features = ["server"] }
async-trait = "0.1.89"
prometheus = "0.14"
lazy_static = "1.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["rocksdb-backend"]
pool = []  # Enable pool database functionality (Phase 8)
rocksdb-backend = ["bitquan-storage/rocksdb-backend"]
randomx = ["bitquan-consensus/randomx"]
mainnet = []
testing = []  # Enable Mock PoW and other testing utilities (NOT for production)

[[test]]
name = "p2p_mempool_relay"
path = "../../tests/p2p_mempool_relay.rs"
