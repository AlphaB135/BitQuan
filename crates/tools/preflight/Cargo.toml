[package]
name = "bq-preflight"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BitQuan preflight validation tool for DNS/TCP probing"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.50", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "bq-preflight"
path = "src/main.rs"
