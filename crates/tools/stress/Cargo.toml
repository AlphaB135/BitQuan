[package]
name = "bq-stress"
version = "0.1.0"
edition = "2021"
authors = ["BitQuan Contributors"]
license = "Apache-2.0"
description = "Load and stress testing harness for BitQuan nodes"

[[bin]]
name = "bq-stress"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
anyhow = "1.0"

[dev-dependencies]
