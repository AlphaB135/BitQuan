[package]
name = "bitquan-consensus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Consensus rules and validation primitives for BitQuan."

[features]
default = []
randomx = ["dep:randomx-rs"]  # Feature flag for RandomX PoW engine (testnet-only)
ethash = ["dep:ethash", "dep:etcommon-bigint"]

[dependencies]
bq-crypto = { path = "../crypto", version = "0.1.0" }
bitquan-types = { path = "../types", version = "0.1.0" }
thiserror.workspace = true
sha2.workspace = true
sha3 = "0.10"
blake3 = "1.8"
hex.workspace = true
serde.workspace = true
clap.workspace = true
chrono = { version = "0.4", features = ["serde"] }
randomx-rs = { version = "1.3", optional = true }
ethash = { version = "0.1.2", optional = true }
etcommon-bigint = { version = "0.2", optional = true }
primitive-types = { version = "0.12", default-features = false }
maxminddb = "0.27"
ipnet = "2.12"
parking_lot = "0.12"
rayon.workspace = true
log.workspace = true

[dev-dependencies]
bitquan-storage = { path = "../storage", version = "0.1.0" }
proptest = "1.11"
