[package]
name = "bitquan-consensus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Consensus rules and validation primitives for BitQuan."

[features]
default = []
randomx = ["dep:randomx-rs"]  # Feature flag for RandomX PoW engine (testnet-only)
ethash = ["dep:ethash", "dep:ethereum-types"]  # Feature flag for Ethash PoW engine

[dependencies]
bq-crypto = { path = "../crypto", version = "0.1.0" }
bitquan-types = { path = "../types", version = "0.1.0" }
thiserror.workspace = true
sha2.workspace = true
sha3 = "0.10"
blake3 = "1.5"
hex.workspace = true
serde.workspace = true
clap.workspace = true
chrono = { version = "0.4", features = ["serde"] }
randomx-rs = { version = "1.3", optional = true }
ethash = { version = "0.4", optional = true }
ethereum-types = { version = "0.8", optional = true }
primitive-types = { version = "0.6" }
maxminddb = "0.26"
ipnet = "2.9"
parking_lot = "0.12"

[dev-dependencies]
bitquan-storage = { path = "../storage", version = "0.1.0" }
proptest = "1.4"
