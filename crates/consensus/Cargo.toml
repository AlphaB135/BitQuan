[package]
name = "bitquan-consensus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Consensus rules and validation primitives for BitQuan."

[features]
default = []
randomx = []  # Feature flag for RandomX PoW engine (testnet-only)

[dependencies]
bq-crypto = { path = "../crypto", version = "0.0.1" }
bitquan-types = { path = "../types", version = "0.1.0" }
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
clap.workspace = true
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
bitquan-storage = { path = "../storage", version = "0.1.0" }
proptest = "1.4"
