[package]
name = "bitquan-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "JSON-RPC server for BitQuan node"

[dependencies]
async-trait = "0.1"
bitquan-types = { path = "../types", version = "0.1.0" }
bitquan-consensus = { path = "../consensus", version = "0.1.0" }
bitquan-storage = { path = "../storage", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
base64 = "0.22"
ipnetwork = "0.20"
once_cell = "1"
http = "1"
httparse = "1.8"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
rcgen = "0.14"

# JWT Authentication
jsonwebtoken = "10"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"
toml = "0.9"
subtle = "2"
regex = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures = "0.3"
toml = "0.9"
