[package]
name = "bitquan-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "JSON-RPC server for BitQuan node"

[dependencies]
bitquan-types = { path = "../types", version = "0.1.0" }
bitquan-consensus = { path = "../consensus", version = "0.1.0" }
bitquan-storage = { path = "../storage", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
anyhow.workspace = true
base64 = "0.22"
ipnetwork = "0.20"
once_cell = "1"
http = "1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.1"
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["logging"] }
rcgen = "0.13"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures = "0.3"
