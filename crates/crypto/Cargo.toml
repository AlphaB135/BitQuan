[package]
name = "bq-crypto"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alphab/BitQuan"
description = "BitQuan cryptography utilities with deterministic RNG support."

[features]
deterministic_tests = []

[dependencies]
bitquan-types = { path = "../types", version = "0.1.0" }
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.8"
thiserror = "1"
hex = "0.4"
pqc_dilithium = "0.2"
subtle = "2.6"

[dev-dependencies]
proptest = "1.9"
hex = "0.4"
