[package]
name = "bq-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alphab/BitQuan"
description = "BitQuan cryptography utilities with deterministic RNG support."

[features]
default = ["memory-security"]
deterministic_tests = []
memory-locking = ["libc"]
memory-security = ["memory-locking"]

[dependencies]
bitquan-types = { path = "../types", version = "0.1.0" }
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.8"
libc = { version = "0.2", optional = true }
thiserror = "1"
hex = "0.4"
pqc-dilithium-seeded = { path = "../pqc-dilithium-seeded", version = "0.2.1", default-features = false, features = ["mode5"] }
subtle = "2.6"
serde = { workspace = true }
serde_json = { workspace = true }
argon2 = "0.5"
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
blake3 = "1.8.2"

[dev-dependencies]
proptest = "1.4"
hex = "0.4"
tempfile = "3"
criterion = "0.5"
