apiVersion: v1
kind: Service
metadata:
  name: bitquan-node
  namespace: bitquan-staging
  labels:
    app: bitquan-node
    environment: staging
spec:
  selector:
    app: bitquan-node
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 81
    targetPort: 8081
    protocol: TCP
  - name: stratum
    port: 3333
    targetPort: 3333
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: bitquan-node
  namespace: bitquan-testnet
  labels:
    app: bitquan-node
    environment: testnet
spec:
  selector:
    app: bitquan-node
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 81
    targetPort: 8081
    protocol: TCP
  - name: stratum
    port: 3333
    targetPort: 3333
    protocol: TCP
  type: LoadBalancer
  loadBalancerSourceRanges:
  - 0.0.0.0/0
---
apiVersion: v1
kind: Service
metadata:
  name: bitquan-node
  namespace: bitquan-mainnet
  labels:
    app: bitquan-node
    environment: mainnet
spec:
  selector:
    app: bitquan-node
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 81
    targetPort: 8081
    protocol: TCP
  - name: stratum
    port: 3333
    targetPort: 3333
    protocol: TCP
  type: LoadBalancer
  loadBalancerSourceRanges:
  - 0.0.0.0/0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitquan-data-staging
  namespace: bitquan-staging
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitquan-data-testnet
  namespace: bitquan-testnet
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: gp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitquan-data-mainnet
  namespace: bitquan-mainnet
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  storageClassName: gp3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bitquan-node-staging
  namespace: bitquan-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bitquan-node
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bitquan-node-testnet
  namespace: bitquan-testnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bitquan-node
  minReplicas: 3
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bitquan-node-mainnet
  namespace: bitquan-mainnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bitquan-node
  minReplicas: 5
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 5
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60