version: '3.8'

services:
  # BitQuan Testnet Node
  bitquan-node:
    image: bitquan/node:v1.0.0-testnet
    container_name: bitquan-testnet
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NETWORK: testnet
    ports:
      - "8333:8333"  # P2P
      - "8334:8334"  # RPC
      - "3333:3333"  # Stratum
      - "8080:8080"  # Dashboard
      - "9090:9090"  # Metrics
    volumes:
      - bitquan-data:/data
      - ./config/testnet.toml:/config/testnet.toml:ro
      - ./config/jwt.secret:/config/jwt.secret:ro
    environment:
      - BITQUAN_NETWORK=testnet
      - BITQUAN_DATA_DIR=/data
      - BITQUAN_CONFIG=/config/testnet.toml
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    restart: unless-stopped
    networks:
      - bitquan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8334/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Block Explorer (optional)
  explorer:
    image: bitquan/explorer:latest
    container_name: bitquan-explorer
    ports:
      - "3000:3000"
    environment:
      - RPC_URL=http://bitquan-node:8334
      - NETWORK=testnet
    depends_on:
      - bitquan-node
    networks:
      - bitquan-net
    restart: unless-stopped

  # Faucet (optional)
  faucet:
    image: bitquan/faucet:latest
    container_name: bitquan-faucet
    ports:
      - "5000:5000"
    environment:
      - RPC_URL=http://bitquan-node:8334
      - FAUCET_AMOUNT=100
      - COOLDOWN_HOURS=24
    volumes:
      - ./config/faucet-wallet.keystore:/faucet-wallet.keystore:ro
    depends_on:
      - bitquan-node
    networks:
      - bitquan-net
    restart: unless-stopped

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: bitquan-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - bitquan-net
    restart: unless-stopped

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: bitquan-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bitquan-net
    restart: unless-stopped

networks:
  bitquan-net:
    driver: bridge

volumes:
  bitquan-data:
  prometheus-data:
  grafana-data:
