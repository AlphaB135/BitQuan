name: Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 1 * * 1'  # Weekly at 1 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detect code changes to skip benchmarks on non-code changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'benches/**'
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  # Performance benchmarks
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install benchmark tools
        run: |
          cargo install cargo-criterion --locked || echo "cargo-criterion install skipped"
          cargo install cargo-benchcmp --locked || echo "cargo-benchcmp install skipped"
          cargo install cargo-flamegraph --locked || echo "cargo-flamegraph install skipped"

      - name: Prepare test data
        run: |
          # Generate test data for benchmarks
          mkdir -p test-data
          # Create test blockchain data
          cargo run --bin generate-test-data --release -- -o test-data/ || echo "generate-test-data binary not available, skipping"

      - name: Run consensus benchmarks
        run: |
          cargo criterion --bench consensus --sample-size 200 --measurement-time 5s --warm-up-time 2s || echo "consensus benchmark not available"

      - name: Run crypto benchmarks
        run: |
          cargo criterion --bench crypto --sample-size 200 --measurement-time 5s --warm-up-time 2s || echo "crypto benchmark not available"

      - name: Run mempool benchmarks
        run: |
          cargo criterion --bench mempool --sample-size 200 --measurement-time 5s --warm-up-time 2s || echo "mempool benchmark not available"

      - name: Generate benchmark report
        run: |
          cd target/criterion
          echo "# Performance Benchmark Report" > report.md
          echo "" >> report.md
          echo "Generated on: $(date)" >> report.md
          echo "" >> report.md

          # Process benchmark results
          for benchmark in */*/report/index.html; do
            if [ -f "$benchmark" ]; then
              name=$(echo $benchmark | sed 's|/report/index.html||' | sed 's|/||' | sed 's|/| |g')
              echo "## $name" >> report.md
              echo "" >> report.md
              echo "### Summary:" >> report.md
              echo "- Sample size: 200" >> report.md
              echo "- Measurement time: 5s" >> report.md
              echo "- Warm-up time: 2s" >> report.md
              echo "" >> report.md
            fi
          done

          echo "### Detailed Results:" >> report.md
          echo "See individual benchmark directories for detailed results." >> report.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.run_number }}
          path: |
            target/criterion/
            test-data/
            report.md
          retention-days: 90

  # Memory profiling
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config valgrind

      - name: Install memory profiling tools
        run: |
          cargo install cargo-flamegraph --locked || echo "cargo-flamegraph install skipped"

      - name: Run with Valgrind
        run: |
          valgrind --tool=memcheck --leak-check=full --show-leak-kinds=all \
            --track-origins=yes \
            --log-file=valgrind.log \
            cargo test --release --bin bitquan-node -- --config config/testnet.toml || echo "Valgrind test skipped or failed"

      - name: Analyze memory usage
        run: |
          if [ -f valgrind.log ]; then
            echo "Memory analysis:"
            grep "ERROR SUMMARY" valgrind.log || echo "No error summary"
            grep "definitely lost" valgrind.log || echo "No memory leaks detected"
          else
            echo "No valgrind.log found"
          fi

      - name: Generate flamegraph
        run: |
          cargo flamegraph \
            --bin bitquan-node \
            --profile release \
            --features "full" \
            -- \
            --config config/testnet.toml \
            --peers 5 \
            --duration 30 || echo "Flamegraph generation skipped"

      - name: Upload memory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memory-profile-${{ github.run_number }}
          path: |
            valgrind.log
            flamegraph.svg
          retention-days: 90

  # Performance regression detection
  regression-detection:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install benchmark tools
        run: |
          cargo install cargo-criterion --locked || echo "cargo-criterion install skipped"
          cargo install cargo-benchcmp --locked || echo "cargo-benchcmp install skipped"

      - name: Find previous benchmarks
        id: find-benchmarks
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.run_id - 1,
            });
            const match = artifacts.data.artifacts.find((a) => a.name.startsWith('benchmarks-'));
            if (match) {
              core.setOutput('artifact-id', match.id);
              core.setOutput('artifact-name', match.name);
            }

      - name: Download previous benchmarks
        if: steps.find-benchmarks.outputs.artifact-id
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find-benchmarks.outputs.artifact-name }}

      - name: Run benchmarks
        run: |
          cargo criterion --bench consensus --sample-size 100 --measurement-time 3s --warm-up-time 1s || echo "consensus benchmark not available"
          cargo criterion --bench crypto --sample-size 100 --measurement-time 3s --warm-up-time 1s || echo "crypto benchmark not available"

      - name: Compare with previous
        run: |
          if [ -d "benchmarks" ]; then
            echo "Comparing with previous benchmarks..."
            for bench in $(ls target/criterion/ | grep -v target); do
              if [ -f "benchmarks/$bench/benches.json" ]; then
                cargo benchcmp benchmarks/$bench target/criterion/$bench/ > $bench-regression.txt
                echo "Regression check for $bench:"
                cat $bench-regression.txt
              fi
            done
          fi

      - name: Check for regressions
        run: |
          if ls *regression.txt 1> /dev/null 2>&1; then
            echo "Checking for regressions..."
            for file in *regression.txt; do
              if grep -q "regression" "$file"; then
                echo "🚨 Performance regression detected in $file:"
                cat "$file"
              fi
            done
          fi

      - name: Upload regression report
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_number }}
          path: *regression.txt
          if-no-files-found: ignore
          retention-days: 30

  # Load testing
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install load testing tools
        run: |
          cargo install cargo-ndk --locked || echo "cargo-ndk install skipped"
          pip install locust || echo "locust install skipped"

      - name: Start test nodes
        run: |
          # Start a test node
          timeout 60s cargo run --release -- \
            --config config/testnet.toml \
            --data-dir load-test-data \
            --port 8333 \
            --rpc-port 8334 & || echo "Node startup skipped"
          sleep 30

      - name: Run load tests
        run: |
          python3 -c "
          import locust
          from locust import HttpUser, task, between

          class BitQuanUser(HttpUser):
              wait_time = between(1, 5)

              @task
              def get_block_count(self):
                  self.client.get('/rpc/getblockcount')

              @task(3)
              def get_block(self):
                  self.client.get('/rpc/getblock?index=0')

              @task(5)
              def get_mempool(self):
                  self.client.get('/rpc/getmempoolinfo')

          if __name__ == '__main__':
              locust.main(locustfile=__file__)
          " & || echo "Python locust setup skipped"
          sleep 30

          # Run load test
          locust --host=http://localhost:8334 --users=100 --spawn-rate=10 --run-time=60s || echo "Load test skipped"

      - name: Analyze load test results
        run: |
          if [ -f load-test-stats.json ]; then
            echo "Load Test Results:"
            cat load-test-stats.json | jq .
          fi

      - name: Clean up
        run: |
          pkill -f "bitquan-node" || true
          pkill -f "locust" || true

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-${{ github.run_number }}
          path: |
            load-test-stats.json
            load-test-report.html
          retention-days: 30

  # Database performance
  db-performance:
    name: Database Performance
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sqlite3 \
            postgresql-client \
            libpq-dev \
            redis-server \
            redis-tools \
            libsqlite3-dev

          # Start services
          sudo service postgresql start
          sudo -u postgres createdb bitquan_perf || true
          sudo service redis-server start || sudo redis-server --daemonize yes

      - name: Test RocksDB performance
        run: |
          cargo test --test rocksdb_perf --release -- --nocapture || echo "rocksdb_perf test not available"

      - name: Test SQLite performance
        run: |
          cargo test --test sqlite_perf --release -- --nocapture || echo "sqlite_perf test not available"

      - name: Test PostgreSQL performance
        run: |
          cargo test --test postgres_perf --release -- --nocapture || echo "postgres_perf test not available"

      - name: Test Redis performance
        run: |
          cargo test --test redis_perf --release -- --nocapture || echo "redis_perf test not available"

      - name: Generate DB benchmark report
        run: |
          echo "# Database Performance Report" > db-report.md
          echo "" >> db-report.md
          echo "Database performance test results:" >> db-report.md
          echo "" >> db-report.md
          echo "- RocksDB: Completed" >> db-report.md
          echo "- SQLite: Completed" >> db-report.md
          echo "- PostgreSQL: Completed" >> db-report.md
          echo "- Redis: Completed" >> db-report.md

      - name: Upload DB benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: db-benchmarks-${{ github.run_number }}
          path: db-report.md
          retention-days: 30