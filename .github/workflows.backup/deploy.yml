name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo build --release --bin bitquan-node
          mkdir -p dist
          cp target/release/bitquan-node dist/
          chmod +x dist/bitquan-node

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: bitquan-linux-x86_64
          path: dist/bitquan-node
          retention-days: 1

  deploy:
    name: Deploy to Cluster
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'testnet' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: bitquan-linux-x86_64
          path: dist

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to cluster
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'bitquan' }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR || '/opt/bitquan' }}
        run: |
          chmod +x deploy/scripts/deploy-cluster.sh
          NODES_FILE="deploy/configs/cluster-nodes-${{ github.event.inputs.environment || 'testnet' }}.txt"

          # Check if nodes file has any active nodes
          if ! grep -v '^#' "$NODES_FILE" | grep -v '^$' > /dev/null 2>&1; then
            echo "⚠️  No nodes configured in $NODES_FILE"
            echo "Please add node addresses to the file to enable deployment."
            echo "Skipping deployment (this is not an error)."
            exit 0
          fi

          ./deploy/scripts/deploy-cluster.sh "$NODES_FILE"

      - name: Verify deployment
        run: |
          echo "✅ Deployment workflow completed"
          echo "Note: Add health check commands for your cluster nodes here"
