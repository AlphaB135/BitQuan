name: Security Scan (Optimized)

on:
  push:
    branches: [ main, develop, feature/*, fix/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  security-scan:
    name: Comprehensive Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev pkg-config

    - name: Install Security Tools
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny, cargo-cyclonedx

    - name: Run Cargo Deny
      run: cargo deny check

    - name: Run Clippy Security Lints
      run: |
        cargo clippy --lib --bins --all-features -- -D warnings \
          -W clippy::panic \
          -W clippy::unimplemented \
          -W clippy::unwrap_used \
          -W clippy::expect_used

    - name: Secret Scanning with TruffleHog
      if: github.event_name == 'pull_request'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --only-verified

    - name: SBOM Generation
      run: cargo cyclonedx --format json > sbom.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v6
      with:
        name: sbom
        path: sbom.json
        retention-days: 90

  codeql-analysis:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'rust'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:rust"

  ossf-scorecard:
    name: OSSF Security Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Run OSSF Scorecard
      uses: ossf/scorecard-action@v2.4.3
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload SARIF results to code scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
