name: Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - testnet
          - mainnet
      region:
        description: 'Deployment region'
        required: true
        type: choice
        default: 'us-west-2'
        options:
          - us-west-2
          - us-east-1
          - eu-west-1
      force_deploy:
        description: 'Force deployment (skip health checks)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and compliance checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    outputs:
      security-passed: ${{ steps.scan.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run security audit
        id: scan
        run: |
          echo "Running comprehensive security scan..."

          # Cargo audit
          if cargo audit --quiet > /dev/null 2>&1; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "Security audit failed"
            exit 1
          fi

          # Deny check
          cargo deny check

          # Trivy filesystem scan
          sudo apt-get update && sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy
          trivy fs --exit-code 0 --no-progress .

  # Build and test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    if: needs.security-scan.outputs.security-passed == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: |
          cargo test --all --locked --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check

      - name: Extract version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bitquan-node") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # Infrastructure validation
  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: deploy/terraform

      - name: Terraform init
        run: terraform init -input=false
        working-directory: deploy/terraform
        env:
          TF_VAR_aws_region: ${{ github.event.inputs.region || 'us-west-2' }}
          TF_VAR_environment: ${{ github.event.inputs.environment || 'staging' }}

      - name: Terraform validate
        run: terraform validate
        working-directory: deploy/terraform

      - name: Terraform plan
        run: terraform plan -out=tfplan -input=false
        working-directory: deploy/terraform
        env:
          TF_VAR_aws_region: ${{ github.event.inputs.region || 'us-west-2' }}
          TF_VAR_environment: ${{ github.event.inputs.environment || 'staging' }}

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-infrastructure]
    if: github.event.inputs.environment == 'staging' || github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.bitquan.network
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to staging environment..."
          # Kubernetes deployment logic here
          kubectl set image deployment/bitquan-node \
            bitquan-node=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.version }} \
            -n bitquan-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/bitquan-node -n bitquan-staging --timeout=300s

      - name: Health check
        run: |
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app=bitquan-node -n bitquan-staging --timeout=300s

          # Run health checks
          for i in {1..10}; do
            if curl -f http://staging.bitquan.network/health || \
               curl -f http://staging.bitquan.network/metrics; then
              echo "Health check passed"
              break
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 30
          done

  # Deploy to testnet
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-infrastructure, deploy-staging]
    if: github.event.inputs.environment == 'testnet'
    environment:
      name: testnet
      url: https://testnet.bitquan.network
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Testnet
        run: |
          echo "Deploying to testnet environment..."
          # Testnet deployment logic here
          kubectl set image deployment/bitquan-node \
            bitquan-node=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.version }} \
            -n bitquan-testnet

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/bitquan-node -n bitquan-testnet --timeout=600s

      - name: Comprehensive health check
        run: |
          # Extended health checks for testnet
          kubectl wait --for=condition=ready pod -l app=bitquan-node -n bitquan-testnet --timeout=600s

          # Test API endpoints
          curl -f http://testnet.bitquan.network/health
          curl -f http://testnet.bitquan.network/metrics
          curl -f http://testnet.bitquan.network/api/v1/status

          # Test blockchain sync
          sleep 60  # Allow time for initial sync
          curl -f http://testnet.bitquan.network/api/v1/sync/status

  # Deploy to mainnet (manual approval required)
  deploy-mainnet:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-infrastructure, deploy-testnet]
    if: github.event.inputs.environment == 'mainnet'
    environment:
      name: mainnet
      url: https://mainnet.bitquan.network
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pre-deployment checklist
        run: |
          echo "🚨 MAINNET DEPLOYMENT - PRE-DEPLOYMENT CHECKLIST 🚨"
          echo "✅ Security scan passed"
          echo "✅ All tests passed"
          echo "✅ Infrastructure validated"
          echo "✅ Staging deployment successful"
          echo "✅ Testnet deployment successful"
          echo ""
          echo "Version: ${{ needs.build-and-test.outputs.version }}"
          echo "Commit: ${{ github.sha }}"
          echo "Force deploy: ${{ github.event.inputs.force_deploy }}"
          ""

      - name: Create backup
        run: |
          echo "Creating backup of current mainnet deployment..."
          # Backup current deployment
          kubectl get deployment bitquan-node -n bitquan-mainnet -o yaml > backup-deployment-$(date +%Y%m%d-%H%M%S).yaml

      - name: Deploy to Mainnet
        run: |
          echo "🚀 DEPLOYING TO MAINNET 🚀"
          # Mainnet deployment with zero-downtime strategy
          kubectl set image deployment/bitquan-node \
            bitquan-node=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.version }} \
            -n bitquan-mainnet

      - name: Monitor rollout
        run: |
          echo "Monitoring mainnet rollout..."
          kubectl rollout status deployment/bitquan-node -n bitquan-mainnet --timeout=900s

          # Extended monitoring for mainnet
          for i in {1..30}; do
            echo "Health check $i/30..."
            if curl -f http://mainnet.bitquan.network/health && \
               curl -f http://mainnet.bitquan.network/metrics; then
              echo "✅ Mainnet health check passed"
            else
              echo "❌ Mainnet health check failed!"
              if [ "${{ github.event.inputs.force_deploy }}" != "true" ]; then
                echo "Rolling back..."
                kubectl rollout undo deployment/bitquan-node -n bitquan-mainnet
                exit 1
              fi
            fi
            sleep 60
          done

      - name: Post-deployment verification
        run: |
          echo "🎉 MAINNET DEPLOYMENT SUCCESSFUL 🎉"
          echo ""
          echo "Deployment summary:"
          echo "- Version: ${{ needs.build-and-test.outputs.version }}"
          echo "- Commit: ${{ github.sha }}"
          echo "- Timestamp: $(date)"
          echo "- Region: ${{ github.event.inputs.region }}"
          ""

          # Verify blockchain operations
          curl -f http://mainnet.bitquan.network/api/v1/status
          curl -f http://mainnet.bitquan.network/api/v1/sync/status

          # Send notification
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"🎉 BitQuan mainnet deployment successful! Version ${{ needs.build-and-test.outputs.version }}\"}"

  # Rollback (manual trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back deployment in ${{ github.event.inputs.environment }}..."
          kubectl rollout undo deployment/bitquan-node -n bitquan-${{ github.event.inputs.environment }}
          kubectl rollout status deployment/bitquan-node -n bitquan-${{ github.event.inputs.environment }} --timeout=300s
