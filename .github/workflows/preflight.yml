name: Pre-Launch Preflight Validation

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to validate'
        required: true
        type: choice
        options:
          - mainnet
          - testnet
        default: mainnet
      release_tag:
        description: 'Release tag (e.g., v1.0.0-rc1)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*-rc*'
      - 'v*.*.*'
  pull_request:
    paths:
      - 'scripts/preflight/**'
      - 'genesis/**'
      - 'crates/consensus/**'
      - 'crates/rpc/**'
      - '.github/workflows/preflight.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Preflight Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace (for validation only)
        run: cargo build --locked --release --bin bitquan-node

      - name: Verify preflight scripts exist
        run: |
          echo "✅ Checking preflight scripts..."
          test -f scripts/preflight/preflight.sh && echo "Found preflight.sh" || exit 1
          test -x scripts/preflight/preflight.sh && echo "Preflight.sh is executable" || chmod +x scripts/preflight/preflight.sh

  test-unit:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run all tests
        run: cargo test --all --locked

      - name: Run preflight tests specifically
        run: cargo test --test '*' --locked -- preflight

  preflight-mainnet:
    name: Preflight Validation - Mainnet (Mock)
    runs-on: ubuntu-latest
    needs: [build, test-unit]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq dnsutils netcat-openbsd

      - name: Make scripts executable
        run: chmod +x scripts/preflight/*.sh

      - name: Run preflight validation (mock mode)
        env:
          PREFLIGHT_MOCK: "1"
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0-rc1' }}"
          bash scripts/preflight/preflight.sh --network mainnet --release-tag "$RELEASE_TAG"

      - name: Upload preflight report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: preflight-report-mainnet
          path: |
            preflight_report.md
            preflight_raw_logs.txt
          retention-days: 30

  preflight-testnet:
    name: Preflight Validation - Testnet (Mock)
    runs-on: ubuntu-latest
    needs: [build, test-unit]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq dnsutils netcat-openbsd

      - name: Make scripts executable
        run: chmod +x scripts/preflight/*.sh

      - name: Run preflight validation (mock mode)
        env:
          PREFLIGHT_MOCK: "1"
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0-rc1' }}"
          bash scripts/preflight/preflight.sh --network testnet --release-tag "$RELEASE_TAG"

      - name: Upload preflight report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: preflight-report-testnet
          path: |
            preflight_report.md
            preflight_raw_logs.txt
          retention-days: 30

  summary:
    name: Preflight Summary
    runs-on: ubuntu-latest
    needs: [preflight-mainnet, preflight-testnet]
    if: always()
    steps:
      - name: Download mainnet report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: preflight-report-mainnet
          path: reports/mainnet/

      - name: Download testnet report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: preflight-report-testnet
          path: reports/testnet/

      - name: Display summary
        run: |
          echo "## Preflight Validation Summary"
          echo ""
          if [ -f reports/mainnet/preflight_report.md ]; then
            echo "### Mainnet Report"
            cat reports/mainnet/preflight_report.md
            echo ""
          fi
          if [ -f reports/testnet/preflight_report.md ]; then
            echo "### Testnet Report"
            cat reports/testnet/preflight_report.md
            echo ""
          fi

      - name: Check status
        run: |
          EXIT_CODE=0
          if [ -f reports/mainnet/preflight_report.md ]; then
            if grep -q "✗ FAIL" reports/mainnet/preflight_report.md; then
              echo "❌ Mainnet preflight failed"
              EXIT_CODE=1
            else
              echo "✅ Mainnet preflight passed"
            fi
          fi
          if [ -f reports/testnet/preflight_report.md ]; then
            if grep -q "✗ FAIL" reports/testnet/preflight_report.md; then
              echo "❌ Testnet preflight failed"
              EXIT_CODE=1
            else
              echo "✅ Testnet preflight passed"
            fi
          fi
          exit $EXIT_CODE
