name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  BITQUAN_SKIP_PQC_TESTS: "0"
  CC: clang
  CXX: clang++

jobs:
  fmt:
    name: Format
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
        with:
          components: clippy
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@49a0bdc # v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
      - uses: Swatinem/rust-cache@49a0bdc # v2
      - run: cargo test --package bitquan-consensus --package bitquan-storage --package bitquan-network --package bitquan-rpc --package bitquan-mempool --package bitquan-node --locked

  coverage:
    name: Coverage
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@49a0bdc # v2
      - name: Install llvm-cov
        uses: taiki-e/install-action@8d0d122 # cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --fail-under-lines 65

  deny:
    name: Cargo Deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5 # v2
        with:
          command: check

  fuzz-build:
    name: Fuzz (build only)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
      - name: Install nightly (for fuzz)
        run: rustup toolchain install nightly --component llvm-tools-preview
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@49a0bdc # v2
      - name: Build fuzz targets
        run: |
          if [ -d fuzz ]; then
            cargo install cargo-fuzz --locked
            cargo +nightly fuzz build || echo "Fuzz build skipped"
          else
            echo "No fuzz directory; skipping"
          fi

  docs:
    name: Docs
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@49a0bdc # v2
      - run: cargo doc --all --no-deps --document-private-items
