name: Fast PR

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/fast-pr.yml"

concurrency:
  group: fast-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BITQUAN_SKIP_PQC_TESTS: "1"

jobs:
  fast:
    name: PR quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-pr

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install nextest + llvm-cov
        run: cargo install cargo-nextest cargo-llvm-cov --locked

      - name: Test
        run: cargo nextest run --workspace

      - name: Coverage threshold
        run: cargo llvm-cov nextest --workspace --fail-under-lines 60 --no-report
