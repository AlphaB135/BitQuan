name: Fast PR

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/fast-pr.yml"
  workflow_dispatch:

concurrency:
  group: fast-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BITQUAN_SKIP_PQC_TESTS: "0"
  CC: clang
  CXX: clang++

jobs:
  fast:
    name: PR quick checks
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
        with:
          components: clippy, rustfmt
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@49a0bdc # v2
        with:
          shared-key: fast-pr

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@b66acf5 # v2
        with:
          command: check

      - name: Install nextest + llvm-cov
        uses: taiki-e/install-action@b6b84cf # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Test
        run: cargo nextest run --workspace

      - name: Coverage threshold
        run: cargo llvm-cov nextest --workspace --fail-under-lines 65 --no-report
