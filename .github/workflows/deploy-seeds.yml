name: Deploy Seed Nodes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - testnet
          - mainnet
      tag:
        description: 'Release tag to deploy (e.g., v1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual deployment)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Download release binary
        run: |
          # Download from GitHub releases
          TAG=${{ inputs.tag }}
          BINARY="bitquan-node-linux-x86_64"

          echo "Downloading $BINARY for $TAG..."
          curl -sSL -o $BINARY \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$BINARY"

          curl -sSL -o $BINARY.sha256 \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$BINARY.sha256"

          # Verify checksum
          sha256sum -c $BINARY.sha256

          chmod +x $BINARY

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp bitquan-node-linux-x86_64 deploy-package/bitquan-node
          cp config/*.toml deploy-package/ || echo "No config files"

          # Create deployment manifest
          cat > deploy-package/deployment.json <<EOF
          {
            "tag": "${{ inputs.tag }}",
            "environment": "${{ inputs.environment }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit_sha": "${{ github.sha }}"
          }
          EOF

          cat deploy-package/deployment.json

      - name: Deploy to seed nodes
        if: ${{ !inputs.dry_run }}
        env:
          SEED_HOSTS: ${{ secrets.SEED_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # Parse seed hosts (comma-separated)
          IFS=',' read -ra HOSTS <<< "$SEED_HOSTS"

          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Deploy to each host
          for host in "${HOSTS[@]}"; do
            echo "Deploying to $host..."

            # Copy binary and config
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              deploy-package/* deploy@$host:/tmp/bitquan-deploy/

            # Execute deployment script
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              deploy@$host << 'ENDSSH'
                set -e
                cd /tmp/bitquan-deploy

                # Verify checksum again
                sha256sum -c bitquan-node.sha256 || exit 1

                # Stop existing service
                sudo systemctl stop bitquan-node || true

                # Install new binary
                sudo cp bitquan-node /usr/local/bin/
                sudo chmod +x /usr/local/bin/bitquan-node

                # Update config
                sudo cp *.toml /etc/bitquan/ || true

                # Restart service
                sudo systemctl start bitquan-node
                sudo systemctl status bitquan-node

                # Verify it's running
                sleep 5
                curl -s http://localhost:8332 || echo "Node may still be starting..."
          ENDSSH

            echo "✅ Deployed to $host"
          done

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "🧪 DRY RUN MODE - No actual deployment performed"
          echo "Environment: ${{ inputs.environment }}"
          echo "Tag: ${{ inputs.tag }}"
          echo "Seed hosts would be read from secrets.SEED_HOSTS"
          ls -lh deploy-package/

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest-${{ inputs.environment }}-${{ inputs.tag }}
          path: deploy-package/deployment.json
          retention-days: 90

      - name: Notify deployment status
        if: ${{ !inputs.dry_run }}
        run: |
          echo "✅ Deployment completed successfully"
          echo "Environment: ${{ inputs.environment }}"
          echo "Tag: ${{ inputs.tag }}"
          # Could integrate with Slack/Discord here
