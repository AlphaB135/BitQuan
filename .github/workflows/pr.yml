name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: short

jobs:
  # ── 0. Detect changed paths ──────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      crypto: ${{ steps.filter.outputs.crypto }}
      consensus: ${{ steps.filter.outputs.consensus }}
      supply: ${{ steps.filter.outputs.supply }}
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "**/*.rs"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/pr.yml"
            crypto:
              - "crates/bq-crypto/**"
              - "crates/pqc-dilithium-seeded/**"
            consensus:
              - "crates/bitquan-consensus/**"
              - "crates/consensus/**"
            supply:
              - "deny.toml"
              - "Cargo.lock"
              - "**/Cargo.toml"

  # ── 1. Format ────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── 2. Clippy ────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
        with:
          components: clippy
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config clang libclang-dev
      - uses: Swatinem/rust-cache@49a0bdc # v2
        with:
          cache-on-failure: "true"
      - name: Clippy (all features)
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            --locked \
            -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::integer_arithmetic \
            -W clippy::cast_possible_truncation
      - name: Clippy (no ethash — must compile cleanly)
        run: |
          cargo clippy \
            --all-targets \
            --locked \
            -- -D warnings

  # ── 3. Supply-chain ──────────────────────────────────────────────────────
  deny:
    name: Supply Chain
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.supply == 'true'
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5 # v2
        with:
          command: check all
          log-level: warn

  # ── 4. Tests — PQC tests ALWAYS run, no skipping ────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config clang libclang-dev
      - uses: Swatinem/rust-cache@49a0bdc # v2
        with:
          cache-on-failure: "true"
      - uses: taiki-e/install-action@1613490 # nextest
      - name: Run tests (default features)
        env:
          BITQUAN_SKIP_PQC_TESTS: "0"
        run: cargo nextest run --workspace --locked --retries 2
      - name: Run tests (all features incl. ethash)
        env:
          BITQUAN_SKIP_PQC_TESTS: "0"
        run: cargo nextest run --workspace --all-features --locked --retries 2
      - name: Doctests
        run: cargo test --doc --workspace --locked

  # ── 5. Security-critical gate (extra checks on crypto/consensus changes) -
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.crypto == 'true' ||
      needs.changes.outputs.consensus == 'true'
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config clang libclang-dev
      - uses: Swatinem/rust-cache@49a0bdc # v2
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@b66acf5 # v2
        with:
          command: check advisories
      - name: Verify no unsafe in crypto crates
        run: |
          if grep -r "unsafe " crates/bq-crypto/src/ crates/pqc-dilithium-seeded/src/ \
            --include="*.rs" | grep -v "#\[allow(unsafe" | grep -v "// SAFETY:"; then
            echo "ERROR: unsafe code found in crypto crates without SAFETY comment"
            exit 1
          fi

  # ── 6. RBAC coverage gate ────────────────────────────────────────────────
  rbac-tests:
    name: RPC RBAC Coverage
    runs-on: ubuntu-latest
    needs: changes
    if: contains(github.event.pull_request.changed_files, 'crates/rpc') || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@11d5960 # v4
      - uses: dtolnay/rust-toolchain@4360b52 # stable
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config clang libclang-dev
      - uses: Swatinem/rust-cache@49a0bdc # v2
      - uses: taiki-e/install-action@1613490 # nextest
      - name: Run RBAC tests
        run: |
          cargo nextest run \
            --package bitquan-rpc \
            --locked \
            --filter-expr 'test(rbac) | test(auth) | test(permission)'

  # ── Gate — single required status check ─────────────────────────────────
  gate:
    name: CI / Gate
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny, test, security-gate, rbac-tests]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failures = [k for k,v in data.items() if v['result'] == 'failure']
          if failures:
              print('FAILED: ' + ', '.join(failures))
              sys.exit(1)
          print('All checks passed or skipped')
          ")
