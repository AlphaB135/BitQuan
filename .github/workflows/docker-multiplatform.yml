name: Multi-Platform Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'config/deploy/Dockerfile'
      - 'Dockerfile*'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'config/deploy/Dockerfile'
      - 'Dockerfile*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64,linux/arm/v7'
      push:
        description: 'Push to registry'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      platforms: ${{ steps.meta.outputs.platforms }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: config/deploy/Dockerfile
        push: ${{ github.event_name == 'release' || github.event.inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64,linux/arm/v7' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NETWORK=mainnet
          VERSION=${{ github.ref_name }}
          GIT_COMMIT=${{ github.sha }}

      - name: Test Docker image
        if: github.event_name == 'release'
        run: |
          # Pull the built image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }}

          # Test basic functionality
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }} --version

          # Test health check
          docker run --rm -d --name bitquan-test \
            -p 8333:8333 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }} &

          sleep 10

          # Test health endpoint
          curl -f http://localhost:8333/health || exit 1

          docker stop bitquan-test

  test-platforms:
    name: Test on Different Platforms
    runs-on: ${{ matrix.platform }}
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Docker compatibility
        run: |
          echo "Testing Docker compatibility on ${{ matrix.platform }}..."
          # Add platform-specific tests here

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'release'

    steps:
      - name: Pull Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.digest }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Clair scan
        if: github.repository == 'bitquan/bitquan'
        run: |
          docker run -d --name clair-dev -p 6060-6061:6060-6061 arminc/clair-local-scan:v2.0.8
          sleep 20

          docker run -v $(pwd):/root/.cache/ arminc/clair-scanner:latest \
            --clair=http://docker:6060 \
            --report=/root/.cache/clair-report.json \
            --severity="MEDIUM,HIGH,CRITICAL" \
            --clairctl="timeout=60s" \
            --exit-code=1 \
            --log-level=DEBUG \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.digest }}

          docker stop clair-dev

  publish-docs:
    name: Publish Docker Documentation
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Docker documentation
        run: |
          cat > DOCKER.md << EOF
          # BitQuan Docker Images

          This document describes the Docker images available for BitQuan.

          ## Available Images

          - `ghcr.io/bitquan/bitquan:latest` - Latest stable release
          - `ghcr.io/bitquan/bitquan:v1.0.0` - Specific version

          ## Usage

          ### Pull the image

          \`\`\`bash
          docker pull ghcr.io/bitquan/bitquan:latest
          \`\`\`

          ### Run a node

          \`\`\`bash
          docker run -d \\
            --name bitquan-node \\
            -p 8333:8333 \\
            -p 8334:8334 \\
            -v /path/to/data:/data \\
            ghcr.io/bitquan/bitquan:latest
          \`\`\`

          ### Environment Variables

          - \`BITQUAN_NETWORK\` - Network (mainnet/testnet/regtest)
          - \`BITQUAN_DATA_DIR\` - Data directory
          - \`RUST_LOG\` - Log level

          ## Health Check

          The image includes a health check that can be used with Docker Compose or Kubernetes.

          ## Security

          - Non-root user
          - Regular security updates
          - Vulnerability scanning

          ## Multi-Architecture Support

          Images are available for:
          - Linux AMD64 (x86_64)
          - Linux ARM64
          - Linux ARMv7

          ## Source

          - [GitHub Repository](https://github.com/bitquan/bitquan)
          - [Docker Hub](https://hub.docker.com/r/bitquan/bitquan)
          EOF

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docker-docs-${{ github.run_number }}
          path: DOCKER.md
          retention-days: 365

  # Integration test with Docker Compose
  compose-test:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Run integration tests with Compose
        run: |
          docker-compose -f config/deploy/docker-compose.testnet.yml up -d

          # Wait for services to be ready
          sleep 30

          # Test connectivity
          curl -f http://localhost:8334/health || exit 1
          curl -f http://localhost:8080/dashboard || exit 1

          # Run some basic commands
          docker exec bitquan-testnet bitquan-node --version

          # Test RPC
          docker exec bitquan-testnet bitquan-cli getblockcount || true

          # Clean up
          docker-compose down

      - name: Test scaling
        run: |
          docker-compose -f config/deploy/docker-compose.testnet.yml up -d --scale bitquan-node=3

          sleep 20

          # Verify all instances are running
          docker ps | grep bitquan-node | wc -l | grep -q "3"

          docker-compose down