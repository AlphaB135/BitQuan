name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/integration-tests.yml"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BITQUAN_SKIP_PQC_TESTS: "0"

jobs:
  basic-integration:
    name: Basic Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config clang
      - uses: Swatinem/rust-cache@v2
      - name: Run basic integration tests
        run: |
          BITQUAN_SKIP_PQC_TESTS=1 cargo nextest run --workspace --test integration \
            --features="full" || echo "Integration tests skipped"

  network-integration:
    name: Network Integration Tests (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [sync, peers, broadcast]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Run ${{ matrix.scenario }} tests
        run: |
          case ${{ matrix.scenario }} in
            sync)    cargo test --test network_sync --release -- --nocapture || echo "Skipped" ;;
            peers)   cargo test --test peer_management --release -- --nocapture || echo "Skipped" ;;
            broadcast) cargo test --test block_broadcast --release -- --nocapture || echo "Skipped" ;;
          esac

  multi-node:
    name: Multi-Node Integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config jq
      - uses: Swatinem/rust-cache@v2
      - name: Build node binary
        run: cargo build --release --bin bitquan-node
      - name: Start test cluster and test consensus
        run: |
          mkdir -p test-cluster/{node1,node2,node3}
          for i in 1 2 3; do
            cp config/testnet.toml test-cluster/node$i/config.toml
            sed -i "s/p2p_port = 19444/p2p_port = $((19440 + i))/g" test-cluster/node$i/config.toml
            sed -i "s/rpc_port = 19443/rpc_port = $((19440 + i))/g" test-cluster/node$i/config.toml
            sed -i "s|data/testnet|test-cluster/node$i/data|g" test-cluster/node$i/config.toml
          done
          for i in 1 2 3; do
            ./target/release/bitquan-node --config test-cluster/node$i/config.toml &
          done
          sleep 30
          for i in 1 2 3; do
            curl -f http://localhost:$((19440 + i))/health || echo "Node $i not ready"
          done
          for i in 1 2 3; do
            height=$(curl -s http://localhost:$((19440 + i))/rpc/getblockcount | jq -r '.result // "N/A"')
            echo "Node $i height: $height"
          done
      - name: Clean up
        if: always()
        run: pkill -f "bitquan-node" || true; rm -rf test-cluster

  database-integration:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install database deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            postgresql-client libpq-dev redis-server redis-tools sqlite3 libsqlite3-dev
          sudo service postgresql start
          sudo -u postgres createdb bitquan_test || true
          sudo service redis-server start || sudo redis-server --daemonize yes
      - uses: Swatinem/rust-cache@v2
      - name: Test PostgreSQL
        run: cargo test --test postgres_integration --release -- --nocapture || echo "Skipped"
      - name: Test Redis
        run: cargo test --test redis_integration --release -- --nocapture || echo "Skipped"
      - name: Test RocksDB
        run: cargo test --test rocksdb_integration --release -- --nocapture || echo "Skipped"

  wallet-integration:
    name: Wallet Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test wallet_create --release -- --nocapture || echo "Skipped"
      - run: cargo test --test wallet_ops --release -- --nocapture || echo "Skipped"
      - run: cargo test --test tx_signing --release -- --nocapture || echo "Skipped"
      - run: cargo test --test wallet_backup --release -- --nocapture || echo "Skipped"

  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test block_perf --release -- --nocapture || echo "Skipped"
      - run: cargo test --test mempool_perf --release -- --nocapture || echo "Skipped"
      - run: cargo test --test rpc_perf --release -- --nocapture || echo "Skipped"

  security-integration:
    name: Security Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test auth_tests --release -- --nocapture || echo "Skipped"
      - run: cargo test --test rate_limiting --release -- --nocapture || echo "Skipped"
      - run: cargo test --test input_validation --release -- --nocapture || echo "Skipped"
      - run: cargo test --test error_handling --release -- --nocapture || echo "Skipped"

  aggregate:
    name: Aggregate Results
    runs-on: ubuntu-latest
    needs:
      - basic-integration
      - network-integration
      - multi-node
      - database-integration
      - wallet-integration
      - stress-tests
      - security-integration
    if: always()
    steps:
      - run: |
          echo "Basic: ${{ needs.basic-integration.result }}"
          echo "Network: ${{ needs.network-integration.result }}"
          echo "Multi-Node: ${{ needs.multi-node.result }}"
          echo "Database: ${{ needs.database-integration.result }}"
          echo "Wallet: ${{ needs.wallet-integration.result }}"
          echo "Stress: ${{ needs.stress-tests.result }}"
          echo "Security: ${{ needs.security-integration.result }}"
