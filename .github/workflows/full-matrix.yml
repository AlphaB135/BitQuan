name: Full Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: "0 18 * * *"   # nightly UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Tests (3 OS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.4
      - uses: Swatinem/rust-cache@v2
        with:
          # main/nightly cache key กว้างขึ้นได้ถ้าต้องการ
          shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      - name: Install nextest + llvm-cov
        run: cargo install cargo-nextest cargo-llvm-cov --locked

      - name: Test (nextest)
        run: cargo nextest run --workspace

      - name: Coverage (HTML + summary + lcov)
        if: runner.os == 'Linux'
        run: |
          cargo llvm-cov nextest --workspace --html --lcov --output-path lcov.info --summary-only
        # สามารถอัปโหลด artifact/report ต่อได้

  build-extra-targets:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Build extra targets
    runs-on: ubuntu-latest
    needs: [full]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-gnu wasm32-unknown-unknown
          cargo build --workspace --all-features --target x86_64-unknown-linux-musl
          cargo build --workspace --all-features --target aarch64-unknown-linux-gnu
          cargo build --workspace --all-features --target wasm32-unknown-unknown

  fuzz:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Fuzz (nightly long)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          set -e
          # Actual targets from fuzz_targets/
          for t in fuzz_block fuzz_crypto fuzz_mempool fuzz_network fuzz_script fuzz_transaction fuzz_wire; do
            cargo fuzz run "$t" -- -max_total_time=600
          done

  audit:
    name: Security Audit (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}