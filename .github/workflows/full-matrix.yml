name: Full Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/full-matrix.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: full-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BITQUAN_SKIP_PQC_TESTS: "1"

jobs:
  test:
    name: Tests (3 OS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        if: runner.os == "Linux"
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install system deps (macOS)
        if: runner.os == "macOS"
        run: brew install hidapi || true
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace

  cross-compile:
    name: Build extra targets
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --locked

      - name: Install aarch64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            clang \
            libclang-dev

      - name: Add Rust targets
        run: rustup target add aarch64-unknown-linux-gnu wasm32-unknown-unknown

      - name: Build for musl (static Linux binary)
        run: |
          cross build --target x86_64-unknown-linux-musl --lib --target-dir target-musl \
            -p bitquan-types -p bq-crypto -p bitquan-consensus -p bitquan-mempool \
            -p bitquan-network -p bitquan-rpc -p wallet

      - name: Build for aarch64 (ARM64 Linux)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/aarch64-linux-gnu -I/usr/aarch64-linux-gnu/include"
        run: |
          cargo build --target aarch64-unknown-linux-gnu --lib --target-dir target-aarch64 \
            -p bitquan-types -p bq-crypto -p bitquan-consensus -p bitquan-mempool \
            -p bitquan-network -p bitquan-rpc -p wallet

      - name: Build for wasm32 (WebAssembly)
        run: |
          cargo build --target wasm32-unknown-unknown --lib --target-dir target-wasm \
            -p bitquan-types -p bq-crypto -p bitquan-mempool -p wallet

  fuzz-build:
    name: Fuzz (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build fuzz targets
        run: |
          if [ -d fuzz ]; then
            cargo install cargo-fuzz --locked
            cargo +nightly fuzz build || echo "Fuzz build skipped"
          else
            echo "No fuzz directory; skipping"
          fi

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Full audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
