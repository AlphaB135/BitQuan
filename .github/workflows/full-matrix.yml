name: Full Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: "0 18 * * *"   # nightly UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    # Run on all PRs - removed full-ci label requirement
    name: Tests (3 OS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # RUSTC_WRAPPER: sccache # Temporary disabled due to GitHub Actions infrastructure issue
      # SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      BITQUAN_SKIP_PQC_TESTS: "1"

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      # - uses: mozilla-actions/sccache-action@v0.0.4 # Temporarily disabled
      # - uses: Swatinem/rust-cache@v2 # Temporarily disabled
      #   with:
      #     # main/nightly cache key กว้างขึ้นได้ถ้าต้องการ
      #     shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install nextest
        run: cargo install cargo-nextest --locked

      - name: Test (nextest)
        run: cargo nextest run --workspace

      # Coverage skipped in Full Matrix - use security-scan.yml for coverage reports
      # Running coverage takes 60+ minutes and causes runner timeouts

  build-extra-targets:
    # Run on all PRs - removed full-ci label requirement
    name: Build extra targets
    runs-on: ubuntu-latest
    needs: [full]
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Add targets and build libraries
        run: |
          rustup target add aarch64-unknown-linux-gnu wasm32-unknown-unknown
          # Build library crates for cross targets.
          # musl target skipped: native deps (blake3 SIMD, rocksdb, openssl-sys)
          # require a full C/C++ cross-compiler toolchain with SIMD support.
          cargo build --lib --target aarch64-unknown-linux-gnu
          cargo build --lib --target wasm32-unknown-unknown

  fuzz:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Fuzz (nightly long)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          set -e
          # Actual targets from fuzz_targets/
          for t in fuzz_block fuzz_crypto fuzz_mempool fuzz_network fuzz_script fuzz_transaction fuzz_wire; do
            cargo +nightly fuzz run "$t" -- -max_total_time=480
          done

  audit:
    name: Security Audit (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
